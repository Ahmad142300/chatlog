name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-java@v4
          with:
            distribution: 'temurin'
            java-version: '17'
        - uses: subosito/flutter-action@v2
          with:
            flutter-version: '3.47.9'
            channel: 'stable'
          
        - name: Decode Keystore
          env:
            KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
            KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
          run: |
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
            echo "$KEY_PROPERTIES" > android/key.properties
          
        - run: flutter pub get
        - run: flutter build apk --release --android-skip-build-dependency-validation
          
        - name: Upload APK to Release
          uses: softprops/action-gh-release@v2
          with:
            files: build/app/outputs/flutter-apk/app-release.apk

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Desktop Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsqlite3-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package Linux Bundle
        run: |
          cd build/linux/x64/release/bundle
          tar -czvf ../../../../../personal_chat_log-linux-x64.tar.gz .

      - name: Upload Linux Tarball to Release
        uses: softprops/action-gh-release@v2
        with:
          files: personal_chat_log-linux-x64.tar.gz